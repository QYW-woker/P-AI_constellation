pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
}

include ":app"

// Fix for Windows cross-drive path issue
// This ensures plugin builds use absolute paths instead of relative paths
def localPropertiesFile = rootProject.file("local.properties")
def properties = new Properties()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
}

def flutterSdkPath = properties.getProperty("flutter.sdk")
if (flutterSdkPath != null) {
    // Ensure all Flutter plugins use the project's build directory
    gradle.beforeProject { project ->
        if (project.name.startsWith("flutter_") ||
            project.name.contains("_android") ||
            project.name.contains("android_")) {
            project.buildDir = new File(rootProject.buildDir, project.name)
        }
    }
}
